[package]
name = "crema"
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"
license = "MIT OR Apache-2.0"
description = "A high-performance, sharded Key-Value store utilizing a Multi-Raft consensus architecture"
keywords = ["cache", "distributed", "moka", "raft", "consensus"]
categories = ["caching", "network-programming"]

[features]
default = ["tokio", "memberlist"]
tokio = []
memberlist = ["dep:memberlist", "dep:smol_str"]
rocksdb-storage = ["rocksdb"]
rocksdb-test = ["rocksdb-storage"]
dashboard = ["dep:axum", "dep:tower", "dep:tower-http", "dep:rust-embed", "dep:mime_guess", "dep:tokio-stream", "dep:serde_json"]
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus"]
full = ["memberlist", "rocksdb-storage", "dashboard", "metrics"]

[dependencies]
# Local cache with automatic TTL/eviction
moka = { version = "0.12", features = ["future"] }

# Raft consensus
raft = "0.7"
slog = "2"
protobuf = "2"

# Cluster membership and discovery

# Memberlist for gossip-based discovery (optional)
memberlist = { version = "0.7", optional = true, features = [
    "tcp",
    "crc32",
    "snappy",
    "encryption",
    "tokio",
] }

# Async runtime
tokio = { version = "1", features = ["sync", "time", "rt", "net", "io-util", "macros", "fs"] }
tokio-util = "0.7"
futures = "0.3"

# Serialization
bytes = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1.3.3"

# Utilities
tracing = "0.1"
parking_lot = "0.12"
thiserror = "2"
crc = "3"
dashmap = "6"

# Checkpointing
lz4_flex = "0.12"

# Consistent hashing
twox-hash = "2"

# Chaos testing
rand = "0.9"
slog-term = "2.9.2"

# String types (optional, used by memberlist)
smol_str = { version = "0.3", optional = true }
socket2 = "0.6.1"

# Migration support
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
tempfile = "3"

# Persistent storage (optional)
# Note: Building on Windows requires LLVM/libclang for bindgen
# Install from: https://github.com/llvm/llvm-project/releases
# Then: set LIBCLANG_PATH=C:\Program Files\LLVM\bin
rocksdb = { version = "0.22", optional = true }

# Lazy statics for failpoints
once_cell = "1.19"

# Dashboard (optional)
axum = { version = "0.7", optional = true, features = ["json"] }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", optional = true, features = ["cors"] }
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }
tokio-stream = { version = "0.1", optional = true }
serde_json = { version = "1", optional = true }

# Metrics (optional)
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.16", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
test-log = "0.2"

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "cluster"
path = "examples/cluster.rs"

[[example]]
name = "memberlist-cluster"
path = "examples/memberlist-cluster.rs"

[[example]]
name = "multiraft-cluster"
path = "examples/multiraft-cluster.rs"

[[example]]
name = "checkpointing"
path = "examples/checkpointing.rs"

[[example]]
name = "metrics"
path = "examples/metrics.rs"

[[example]]
name = "dashboard-demo"
path = "examples/dashboard-demo.rs"
required-features = ["dashboard"]

#[[example]]
#name = "dashboard-e2e-test"
#path = "examples/dashboard-e2e-test.rs"
#required-features = ["dashboard"]

[[example]]
name = "benchmark-multiraft"
path = "examples/benchmark-multiraft.rs"
